<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="انتظرونا قريباً — Coming Soon">
  <title>انتظرونا قريباً | Coming Soon</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0b1020;
      --accent: #7c5cff;
      --accent2: #22d3ee;
      --text: #f8fafc;
      --muted: #aab4c8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: "Tajawal", "Cairo", "Segoe UI", Tahoma, Arial, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse at 15% 20%, #38276c 0, transparent 38%),
        radial-gradient(ellipse at 85% 80%, #0c5364 0, transparent 35%),
        var(--bg);
      overflow: hidden;
    }
    .card {
      width: min(760px, 100%);
      padding: clamp(36px, 8vw, 76px) 24px;
      text-align: center;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 28px;
      background: rgba(255,255,255,.055);
      box-shadow: 0 24px 80px rgba(0,0,0,.35);
      backdrop-filter: blur(14px);
      animation: appear .9s ease both;
    }
    .mark {
      width: 76px; height: 76px;
      margin: 0 auto 28px;
      display: grid; place-items: center;
      border-radius: 24px;
      font-size: 34px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      box-shadow: 0 10px 35px rgba(124,92,255,.35);
    }
    .eyebrow {
      color: var(--accent2);
      font-size: 13px;
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
      direction: ltr;
    }
    h1 {
      margin: 18px 0 10px;
      font-size: clamp(38px, 8vw, 68px);
      line-height: 1.25;
      font-weight: 800;
    }
    .english {
      margin: 0;
      direction: ltr;
      font-size: clamp(25px, 5vw, 42px);
      font-weight: 700;
      background: linear-gradient(90deg, #b7a8ff, #67e8f9);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .description {
      max-width: 520px;
      margin: 28px auto 0;
      color: var(--muted);
      font-size: 17px;
      line-height: 1.9;
    }
    .line {
      width: 86px; height: 4px;
      margin: 32px auto 0;
      border-radius: 10px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
    }
    footer {
      margin-top: 38px;
      color: #8490a8;
      font-size: 12px;
      direction: ltr;
    }
    @keyframes appear {
      from { opacity: 0; transform: translateY(18px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="mark" aria-hidden="true">✦</div>
    <div class="eyebrow">Something exciting is coming</div>
    <h1>انتظرونا قريباً</h1>
    <p class="english">Coming Soon</p>
    <p class="description">
      نعمل على تجهيز شيء مميز لكم. ترقبوا انطلاقنا قريباً!
      <br>
      We're preparing something special for you. Stay tuned!
    </p>
    <div class="line" aria-hidden="true"></div>
    <footer>© <span id="year"></span> — All rights reserved</footer>
  </main>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
